name: Implementation or reproducibility bug
description: Report a defect in model code, validation infrastructure, or computational reproducibility
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please provide as much
        detail as possible so the issue can be reproduced and fixed.

  - type: input
    id: release
    attributes:
      label: Release tag
      description: The `pec-prospective-YYYY-MM-DD-rN` tag this applies to
      placeholder: pec-prospective-2026-08-09-r9
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Code implementation
        - Reproducibility (rerun mismatch)
        - Validation infrastructure
        - Deployment-data schema
        - LaTeX compilation
        - Manifest or hashing
        - Documentation error
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug? What file, function, or check is affected?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands and environment needed to reproduce the issue
      placeholder: |
        1. git checkout ...
        2. python -m pec_model.mortality_mature
        3. python scripts/validate_repository.py --rerun
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and package versions
      placeholder: |
        Python 3.13.11, Ubuntu 24.04, numpy 2.4.1, scipy 1.17.0
